<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhoneProof · Check a phone report</title>
<meta name="description" content="Check a used phone's PhoneProof self-test report. The phone's signature is verified in your browser.">
<meta name="theme-color" content="#F2F6F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<link rel="stylesheet" href="/page.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230B6E8A' d='M12 1 3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4zm-2 16-4-4 1.4-1.4 2.6 2.6 6.6-6.6L18 9l-8 8z'/%3E%3C/svg%3E">
</head>
<body>
<main id="app" aria-live="polite">
  <section class="verdict verdict--none" id="verdict">
    <div class="wrap">
      <a class="brand" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4zm-2 16-4-4 1.4-1.4 2.6 2.6 6.6-6.6L18 9l-8 8z"/></svg>PhoneProof</a>
      <p class="kicker" id="kicker">Checking</p>
      <h1 id="title">Checking the report…</h1>
      <p class="lede" id="lede">Verifying the phone's signature in your browser.</p>
    </div>
  </section>
  <div class="wrap" id="body"></div>
</main>

<template id="tpl-landing">
  <div class="card">
    <h2>Check a seller's report</h2>
    <p class="muted">Paste the link from the seller's listing. The report is checked here, in your browser: the phone's signature, Google's certificate chain and the app that made it.</p>
    <form id="link-form" class="row">
      <label class="sr" for="link">Report link</label>
      <input id="link" type="url" inputmode="url" placeholder="https://…/r/…" required>
      <button class="btn">Check</button>
    </form>
  </div>
  <div class="card card--outline">
    <h3>Meeting in person?</h3>
    <p class="muted">A link proves a phone made the report. To be sure it's the phone in front of you, use meet-up mode in the PhoneProof app: your phone shows a code, the seller's phone answers it in seconds.</p>
    <a class="btn btn--tonal" id="get-app" href="#">Get PhoneProof</a>
  </div>
</template>

<script type="module" src="/app.js"></script>
</body>
</html>
